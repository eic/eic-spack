packages:
  all:
    # Force a consistent Linux target so CI buildcache artifacts remain ABI
    # compatible across mixed GitHub runner microarchitectures, but avoid
    # require since then we cannot use system compilers.
    prefer:
    - spec: target=x86_64_v3
      when: platform=linux
    - spec: target=m1
      when: platform=darwin
  c:
    require:
    - spec: gcc@14.2.0
      when: platform=linux
    - spec: apple-clang@21
      when: platform=darwin
  cxx:
    require:
    - spec: gcc@14.2.0
      when: platform=linux
    - spec: apple-clang@21
      when: platform=darwin
  fortran:
    require:
    - spec: gcc@14.2.0
      when: platform=linux
    - spec: apple-clang@21
      when: platform=darwin
  # Require GCC >= 13 runtime to ensure GLIBCXX_3.4.32 (needed by node-js 24/V8
  # and other modern C++20 packages). Without this, the concretizer reuses a
  # stale gcc-runtime-10.x from the build cache (which only provides
  # GLIBCXX <= 3.4.30), causing link-time failures at package build time.
  gcc-runtime:
    require:
      - '@14'
  cppgsl:
    deprecation:
      allow:
      - reason: [unspecified]
        severity: critical
  libglx:
    require:
      - opengl
  egl:
    buildable: false
    externals:
      - spec: egl@1.5
        prefix: /usr
  epic:
    require:
    - '@25.08:'
    - artifacts=epic_craterlake
  opengl:
    buildable: false
    externals:
      - spec: opengl@4.6
        prefix: /usr
  openglu:
    buildable: false
    externals:
      - spec: openglu@1.4
        prefix: /usr
  # With missing_library_policy: error, every installed binary must resolve its
  # DT_NEEDED libraries through its own RPATHs. The system GL/GLU/EGL libraries
  # from the externals above live in default linker paths that Spack does not
  # add to RPATHs, so they must be allowed as unresolved. The post_install
  # check only consults the unresolved_libraries of the package being installed
  # (and skips externals entirely), so this must be set on each GL consumer
  # rather than on the externals; package_attributes is ignored under 'all'.
  ftgl:
    package_attributes:
      unresolved_libraries:
      - libGL.so.*
      - libGLX.so.*
      - libOpenGL.so.*
      - libGLU.so.*
  geant4:
    package_attributes:
      unresolved_libraries:
      - libGL.so.*
      - libGLX.so.*
      - libOpenGL.so.*
      - libGLU.so.*
  gl2ps:
    package_attributes:
      unresolved_libraries:
      - libGL.so.*
      - libGLX.so.*
      - libOpenGL.so.*
  glew:
    package_attributes:
      unresolved_libraries:
      - libGL.so.*
      - libGLX.so.*
      - libOpenGL.so.*
  mesa-glu:
    package_attributes:
      unresolved_libraries:
      - libGL.so.*
      - libGLX.so.*
      - libOpenGL.so.*
  qt-base:
    package_attributes:
      unresolved_libraries:
      - libGL.so.*
      - libGLX.so.*
      - libOpenGL.so.*
      - libGLU.so.*
      - libEGL.so.*
  root:
    package_attributes:
      unresolved_libraries:
      - libGL.so.*
      - libGLX.so.*
      - libOpenGL.so.*
      - libGLU.so.*
  mesa:
    require:
    - ~llvm
  qmake:
    require:
      - qt-base

  # FIXME: remove physics version constraints when freshness is ensured
  edm4hep:
    require:
    - '@1:'
