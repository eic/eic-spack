name: Dispatch eic/containers update-eic-spack

on:
  pull_request_target:
    types: [closed]

jobs:
  dispatch-update-eic-spack:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Trigger eic/containers update-eic-spack workflow
        env:
          GH_TOKEN: ${{ secrets.EIC_CONTAINERS_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Missing secret EIC_CONTAINERS_WORKFLOW_TOKEN"
            exit 1
          fi
          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            /repos/eic/containers/actions/workflows/update-eic-spack.yml/dispatches \
            -f ref=master
