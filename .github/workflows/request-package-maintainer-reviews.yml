name: Request package maintainer reviews

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'spack_repo/eic/packages/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  request-reviews:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Spack
        uses: spack/setup-spack@v3
        with:
          spack_ref: develop
          packages_ref: develop

      - name: Get changed packages
        id: changed-packages
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const packageNames = new Set();
            for (const file of files) {
              const match = file.filename.match(/^spack_repo\/eic\/packages\/([^/]+)\//);
              if (match) {
                packageNames.add(match[1].replaceAll('_', '-'));
              }
            }

            const changed = [...packageNames].sort();
            core.info(`Changed packages: ${JSON.stringify(changed)}`);
            core.setOutput('packages', JSON.stringify(changed));

      - name: Get package maintainers
        id: package-maintainers
        if: steps.changed-packages.outputs.packages != '[]'
        shell: bash
        run: |
          spack repo add ${GITHUB_WORKSPACE}/spack_repo/eic

          maintainer_file=$(mktemp)
          packages='${{ steps.changed-packages.outputs.packages }}'

          for pkg in $(echo "${packages}" | jq -r '.[]'); do
            output=$(spack maintainers "${pkg}" 2>/dev/null || true)
            if [ -z "${output}" ]; then
              continue
            fi

            users=$(printf '%s\n' "${output}" | grep -oE '@[A-Za-z][A-Za-z0-9-]*' | sed 's/^@//' || true)

            if [ -z "${users}" ]; then
              users=$(printf '%s\n' "${output}" | \
                tr ' ' '\n' | \
                sed 's/^@//' | \
                grep -E '^[A-Za-z][A-Za-z0-9-]*$' | \
                grep -v "^${pkg}$" | \
                grep -v "^${pkg//-/_}$" || true)
            fi

            if [ -n "${users}" ]; then
              printf '%s\n' "${users}" >> "${maintainer_file}"
            fi
          done

          if [ -s "${maintainer_file}" ]; then
            maintainers=$(sort -u "${maintainer_file}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            maintainers='[]'
          fi

          echo "Maintainers: ${maintainers}"
          echo "maintainers=${maintainers}" >> $GITHUB_OUTPUT

      - name: Request maintainer reviews
        if: steps.package-maintainers.outputs.maintainers != '[]'
        uses: actions/github-script@v9
        env:
          MAINTAINERS: ${{ steps.package-maintainers.outputs.maintainers }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const maintainers = JSON.parse(process.env.MAINTAINERS || '[]');
            const prAuthor = process.env.PR_AUTHOR;

            const pr = await github.rest.pulls.get({ owner, repo, pull_number });
            const alreadyRequested = new Set(pr.data.requested_reviewers.map((r) => r.login));

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const alreadyReviewed = new Set(
              reviews
                .map((review) => review.user && review.user.login)
                .filter(Boolean)
            );

            const reviewers = maintainers.filter(
              (user) =>
                user !== prAuthor &&
                !alreadyRequested.has(user) &&
                !alreadyReviewed.has(user)
            );

            if (reviewers.length === 0) {
              core.info('No additional eligible maintainers to request for review.');
              return;
            }

            const maxReviewersPerRequest = 15;
            for (let i = 0; i < reviewers.length; i += maxReviewersPerRequest) {
              const chunk = reviewers.slice(i, i + maxReviewersPerRequest);
              try {
                await github.rest.pulls.requestReviewers({
                  owner,
                  repo,
                  pull_number,
                  reviewers: chunk,
                });
                core.info(`Requested reviews from: ${chunk.join(', ')}`);
              } catch (error) {
                core.warning(`Batch request failed (${chunk.join(', ')}): ${error.message}`);
                for (const reviewer of chunk) {
                  try {
                    await github.rest.pulls.requestReviewers({
                      owner,
                      repo,
                      pull_number,
                      reviewers: [reviewer],
                    });
                    core.info(`Requested review from: ${reviewer}`);
                  } catch (singleError) {
                    core.warning(`Could not request review from ${reviewer}: ${singleError.message}`);
                  }
                }
              }
            }
