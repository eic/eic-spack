name: Request package maintainer reviews

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'spack_repo/eic/packages/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  request-reviews:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Request package maintainer reviews
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const headRef = context.payload.pull_request.head.sha;
            const prAuthor = context.payload.pull_request.user.login;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const packageNames = new Set();
            for (const file of files) {
              const match = file.filename.match(/^spack_repo\/eic\/packages\/([^/]+)\//);
              if (match) {
                packageNames.add(match[1]);
              }
            }

            if (packageNames.size === 0) {
              core.info('No modified EIC packages found in this PR.');
              return;
            }

            const extractMaintainers = (content) => {
              const users = new Set();
              const marker = 'maintainers(';
              let markerIndex = 0;

              while (markerIndex < content.length) {
                const start = content.indexOf(marker, markerIndex);
                if (start === -1) {
                  break;
                }

                let cursor = start + marker.length;
                let depth = 1;
                let inString = null;
                let escaped = false;
                let args = '';

                while (cursor < content.length && depth > 0) {
                  const ch = content[cursor];

                  if (inString !== null) {
                    args += ch;
                    if (escaped) {
                      escaped = false;
                    } else if (ch === '\\') {
                      escaped = true;
                    } else if (ch === inString) {
                      inString = null;
                    }
                    cursor += 1;
                    continue;
                  }

                  if (ch === '"' || ch === "'") {
                    inString = ch;
                    args += ch;
                    cursor += 1;
                    continue;
                  }

                  if (ch === '(') {
                    depth += 1;
                    args += ch;
                    cursor += 1;
                    continue;
                  }

                  if (ch === ')') {
                    depth -= 1;
                    if (depth === 0) {
                      cursor += 1;
                      break;
                    }
                    args += ch;
                    cursor += 1;
                    continue;
                  }

                  args += ch;
                  cursor += 1;
                }

                if (depth === 0) {
                  const userRegex = /(["'])([^"'\\]*(?:\\.[^"'\\]*)*)\1/g;
                  let userMatch;
                  while ((userMatch = userRegex.exec(args)) !== null) {
                    users.add(userMatch[2].replace(/\\(["'\\])/g, '$1'));
                  }
                }

                markerIndex = cursor;
              }

              return users;
            };

            const maintainers = new Set();
            for (const packageName of packageNames) {
              const packagePath = `spack_repo/eic/packages/${packageName}/package.py`;
              try {
                const file = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: packagePath,
                  ref: headRef,
                });

                if (Array.isArray(file.data) || !file.data.content) {
                  continue;
                }

                const content = Buffer.from(file.data.content, file.data.encoding).toString('utf8');
                const extractedMaintainers = extractMaintainers(content);
                for (const user of extractedMaintainers) {
                  maintainers.add(user);
                }
              } catch (error) {
                core.warning(`Could not read ${packagePath}: ${error.message}`);
              }
            }

            if (maintainers.size === 0) {
              core.info('No maintainers found for modified packages.');
              return;
            }

            const pr = await github.rest.pulls.get({ owner, repo, pull_number });
            const alreadyRequested = new Set(pr.data.requested_reviewers.map((r) => r.login));

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const alreadyReviewed = new Set(
              reviews
                .map((review) => review.user && review.user.login)
                .filter(Boolean)
            );

            const reviewers = [...maintainers].filter(
              (user) =>
                user !== prAuthor &&
                !alreadyRequested.has(user) &&
                !alreadyReviewed.has(user)
            );

            if (reviewers.length === 0) {
              core.info('No additional eligible maintainers to request for review.');
              return;
            }

            // GitHub allows up to 15 requested reviewers in a single call.
            const maxReviewersPerRequest = 15;
            for (let i = 0; i < reviewers.length; i += maxReviewersPerRequest) {
              const chunk = reviewers.slice(i, i + maxReviewersPerRequest);
              try {
                await github.rest.pulls.requestReviewers({
                  owner,
                  repo,
                  pull_number,
                  reviewers: chunk,
                });
                core.info(`Requested reviews from: ${chunk.join(', ')}`);
              } catch (error) {
                core.warning(`Batch request failed (${chunk.join(', ')}): ${error.message}`);
                for (const reviewer of chunk) {
                  try {
                    await github.rest.pulls.requestReviewers({
                      owner,
                      repo,
                      pull_number,
                      reviewers: [reviewer],
                    });
                    core.info(`Requested review from: ${reviewer}`);
                  } catch (singleError) {
                    core.warning(`Could not request review from ${reviewer}: ${singleError.message}`);
                  }
                }
              }
            }
