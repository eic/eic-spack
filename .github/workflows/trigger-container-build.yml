name: Trigger Container Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read

jobs:
  trigger-build:
    name: Trigger eic/containers build
    runs-on: ubuntu-latest
    # Only run if the required secret is available
    # This allows forks to avoid errors when the secret is not configured
    if: ${{ secrets.CONTAINERS_TRIGGER_TOKEN != '' }}
    env:
      # Target repository and workflow configuration
      TARGET_OWNER: eic
      TARGET_REPO: containers
      TARGET_WORKFLOW: build-push.yml
      TARGET_REF: master
    steps:
      - name: Trigger eic/containers build-push workflow
        uses: actions/github-script@v7
        with:
          # This requires a Personal Access Token (PAT) with 'repo' and 'workflow' scopes
          # stored as a repository secret named CONTAINERS_TRIGGER_TOKEN
          github-token: ${{ secrets.CONTAINERS_TRIGGER_TOKEN }}
          script: |
            const owner = process.env.TARGET_OWNER;
            const repo = process.env.TARGET_REPO;
            const workflow_id = process.env.TARGET_WORKFLOW;
            const ref = process.env.TARGET_REF;

            // Get the HEAD commit SHA from the pull request
            const eicspack_version = context.payload.pull_request.head.sha;

            console.log(`Triggering build-push workflow in ${owner}/${repo}`);
            console.log(`EICSPACK_VERSION: ${eicspack_version}`);
            console.log(`PR: #${context.payload.pull_request.number}`);
            console.log(`PR Title: ${context.payload.pull_request.title}`);

            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: owner,
                repo: repo,
                workflow_id: workflow_id,
                ref: ref,
                inputs: {
                  EICSPACK_VERSION: eicspack_version
                }
              });
              console.log('Workflow dispatch successful');
              console.log(`Monitor the build at: https://github.com/${owner}/${repo}/actions/workflows/${workflow_id}`);
            } catch (error) {
              console.error('Failed to trigger workflow:', error.message);
              throw error;
            }
