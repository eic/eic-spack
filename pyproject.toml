[project]
name = "eic-spack"
description = "EIC Spack package repository"
requires-python = ">=3.6"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["E731", "E203", "F403", "F811"]

[tool.ruff.lint.per-file-ignores]
"spack_repo/*/packages/*/package.py" = ["F403", "F405", "F811", "F821"]
