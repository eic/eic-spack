[tool.ruff]
line-length = 99
src = []

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["E731", "E203", "F403", "F811"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
section-order = [
  "future",
  "standard-library",
  "third-party",
  "vendor",
  "spack",
  "first-party",
  "local-folder",
]

[tool.ruff.lint.isort.sections]
vendor = ["spack.vendor"]
spack = ["spack"]

[tool.ruff.lint.per-file-ignores]
"spack_repo/*/packages/*/package.py" = ["F403", "F405", "F811", "F821"]
