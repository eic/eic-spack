spack:
  specs:
    - lz4@1.10.0 libs=shared target=x86_64_v2 hwcaps=x86_64_v3
    - libarchive@3.8.5 target=x86_64_v2  # depends on liblz4.so; demos runtime hwcaps dispatch
    - lhapdf@6.5.5 target=x86_64_v2 hwcaps=x86_64_v3
    - clhep@2.4.7.2 target=x86_64_v2 hwcaps=x86_64_v3
    - vecgeom@2.0.0 target=x86_64_v2 hwcaps=x86_64_v3
    - fastjet@3.5.1 build_system=cmake target=x86_64_v2 hwcaps=x86_64_v3

  repos:
    - $spack/../eic-spack/spack_repo/eic

  concretizer:
    unify: true
    targets:
      host_compatible: false   # allow target=x86_64 on a skylake host

  packages:
    all:
      compiler: [gcc]

  view: false
